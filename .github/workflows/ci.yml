
name: CloudCart CI and Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test CloudCart API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

  docker-security:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cloudcart:${{ github.sha }} ./app

      - name: Generate Trivy JSON report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudcart:${{ github.sha }}
          format: json
          output: trivy-results.json
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudcart-trivy-report
          path: trivy-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce vulnerability policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudcart:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true